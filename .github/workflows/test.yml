name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check backend
        run: node --check backend/backend.mjs
      - name: syntax check validacion
        run: node --check backend/validacion.mjs
      - name: unit tests
        run: cd backend && node --test test/*.test.mjs
      - name: json catalog valido
        run: node -e "JSON.parse(require('fs').readFileSync('backend/catalogo-defecto.json','utf8'))"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t firepanel:test .
      - name: contenedor arranca
        run: |
          docker run -d --name fp -p 17892:17892 firepanel:test
          sleep 3
          curl -sf http://localhost:17892/api/health
          docker logs fp
          docker stop fp
